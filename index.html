<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест по философии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@700;800&display=swap&subset=cyrillic,latin" rel="stylesheet">
<style>
/* Layout idea: single narrow column, one task at a time; quiz card is the focus, stats and tags stay quiet. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --ink:#151a24; --muted:#5a6475; --line:#d9dee8;
  --accent:#3447c4; --accent-ink:#ffffff; --accent-soft:#e6e9fb;
  --good:#17784f; --good-soft:#dff3e8; --bad:#b83232; --bad-soft:#fbe4e4;
  --f-display:"Manrope","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10131b; --surface:#1a1f2b; --ink:#e8ecf4; --muted:#9aa4b8; --line:#2c3445;
    --accent:#8e9cff; --accent-ink:#10131b; --accent-soft:#252c4d;
    --good:#55d198; --good-soft:#15352a; --bad:#ff8d8d; --bad-soft:#3a1d22;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10131b; --surface:#1a1f2b; --ink:#e8ecf4; --muted:#9aa4b8; --line:#2c3445;
  --accent:#8e9cff; --accent-ink:#10131b; --accent-soft:#252c4d;
  --good:#55d198; --good-soft:#15352a; --bad:#ff8d8d; --bad-soft:#3a1d22;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 56px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:28px}
h2{font-size:20px}
.sub{color:var(--muted);margin:6px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip small{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.hl{border-color:var(--accent)}
label.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.check{display:flex;gap:8px;align-items:center;font-size:15px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.tag{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.tag.q{background:transparent;border:1px solid var(--line);color:var(--muted)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtext{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.35;margin:14px 0 16px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.opt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .n{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .n{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;background:var(--accent-soft)}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb b{font-family:var(--f-display)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.nav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums}
.nav button.done{background:var(--accent-soft);border-color:var(--accent)}
.nav button.cur{outline:2px solid var(--accent);outline-offset:1px}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.score{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.lec{display:grid;grid-template-columns:120px 1fr 56px;gap:10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.lec .bar{height:10px}
.lec .bar i.low{background:var(--bad)} .lec .bar i.mid{background:#c98a12} .lec .bar i.hi{background:var(--good)}
.rev{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.rev p{margin:4px 0}
.mine{color:var(--bad)} .right{color:var(--good)}
.warn{background:var(--bad-soft);border-radius:10px;padding:12px 14px}
.hide{display:none!important}
@media (max-width:480px){
  h1{font-size:24px} .qtext{font-size:19px} .stats{grid-template-columns:1fr 1fr 1fr}
  .lec{grid-template-columns:90px 1fr 48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="wrap" id="app"></div>
<script>
const BANK = [{"l":"1","q":"Historical types of worldview are:","a":"Myth, religion and philosophy","w":["Art, philosophy and culture","Science, progress and philosophy","Religion, philosophy and science","Morality, myth and science"],"e":"Три исторических типа мировоззрения: мифология, религия, философия.","s":"p","id":0},{"l":"1","q":"Self-conscious cognitive thinking in the process of knowledge is...","a":"reflection","w":["imagination","feeling","self-confidence","revelationism"],"e":"Рефлексия — мышление, обращённое на самое себя.","s":"p","id":1},{"l":"1","q":"Who said that philosophy begins with doubt?","a":"Descartes","w":["Plato","Socrates","Democritus","Parmenides"],"e":"Декарт видел начало философии в сомнении; Аристотель — в удивлении.","s":"p","id":2},{"l":"1","q":"There are three objects of cognition:","a":"World, human, society","w":["Nature, love, human","Ethics, morality, sociology","Knowledge, doubt, morality","Myth, religion, philosophy"],"e":"Объекты познания: мир, человек, общество.","s":"p","id":3},{"l":"1","q":"Study of being (philosophical study of being):","a":"Ontology","w":["Gnoseology","Praxeology","Epistemology","Axiology"],"e":"Онтология — учение о бытии: «What exists?»","s":"p","id":4},{"l":"1","q":"\"How can I know?\" is the main question for...","a":"Gnoseology","w":["Ontology","Morality","Ethics","Myth"],"e":"Гносеология = механизм познания (How can I know?).","s":"p","id":5},{"l":"1","q":"Gnoseology is:","a":"Philosophical study of the process of cognition","w":["Philosophical study of knowledge","Philosophical study of being","Philosophical study of man","Philosophical study of the laws of thought"],"e":"Gnoseology — процесс познания; Epistemology — знание как результат.","s":"p","id":6},{"l":"1","q":"\"What do I know?\" is the main question for...","a":"Epistemology","w":["Gnoseology","Praxeology","Ontology","Axiology"],"e":"Epistemology = результат познания (What do I know?).","s":"p","id":7},{"l":"1","q":"\"What are the laws of thinking?\" is a question of...","a":"Logic","w":["Ethics","Gnoseology","Axiology","Epistemology"],"e":"Логика — законы правильного мышления.","s":"p","id":8},{"l":"1","q":"Philosophical study of values:","a":"Axiology","w":["Epistemology","Praxeology","Logic","Ethics"],"e":"Аксиология — ценности; Праксеология — цели человеческой деятельности.","s":"p","id":9},{"l":"1","q":"...is about \"the perceptional preferences of humans\":","a":"Aesthetics","w":["Futurology","Epistemology","Logic","Axiology"],"e":"Эстетика: What is beauty?","s":"p","id":10},{"l":"1","q":"Which philosophical study deals with the aims of human activity?","a":"Praxeology","w":["Futurology","Epistemology","Gnoseology","Ontology"],"e":"Праксеология (praxis — деяние).","s":"p","id":11},{"l":"1","q":"Which philosophical study explores interpretation as the method to know the surrounding world?","a":"Hermeneutics","w":["Rationality","Sensualism","Praxeology","Axiology"],"e":"Герменевтика: How do we understand reality?","s":"p","id":12},{"l":"1","q":"What type of myths explains the origin of the world as a whole and its parts from chaos?","a":"Cosmogonic myths","w":["Anthropogonic myths","Astral myths","Totemic myths","Calendar myths"],"e":"Cosmogonic = происхождение мира из хаоса; Anthropogonic = происхождение человека.","s":"p","id":13},{"l":"1","q":"What type of myths explains the end of the universe?","a":"Eschatological myths","w":["Heroic myths","Astral myths","Totemic myths","Cosmogonic myths"],"e":"Eschatological (eschaton — последний) = конец мира.","s":"p","id":14},{"l":"2.1","q":"How many books do the Vedas contain?","a":"4","w":["2","3","6","5"],"e":"Samhitas, Brahmanas, Aranyakas, Upanishads.","s":"p","id":15},{"l":"2.1","q":"The most basic concept of Indian philosophy:","a":"brahman","w":["purusha","karma","atman","moksha"],"e":"Брахман — вечная космическая субстанция.","s":"p","id":16},{"l":"2.1","q":"In Indian philosophy, during creation of living beings a fundamental principle Brahman concentrates in...","a":"Atman","w":["Karma","Shudra","Samsara","Moksha"],"e":"Атман — внутреннее ядро индивида, тождественное Брахману.","s":"p","id":17},{"l":"2.1","q":"Termination of the cycle of rebirth (Samsara) is called...","a":"moksha","w":["yoga","purusha","brahman","atman"],"e":"Прекращение перерождений = мокша; нирвана = «угасание».","s":"p","id":18},{"l":"2.1","q":"Indian triad of reality (Trimurti) consists of Brahma, Vishnu and...","a":"Shiva","w":["Atman","Samsara","Nirvana","Moksha"],"e":"Brahma — Creator, Vishnu — Guardian, Shiva — Destroyer.","s":"p","id":19},{"l":"2.1","q":"What four main castes (varnas) exist in Indian society?","a":"Brahmins, Kshatriyas, Vaishyas, Shudras","w":["Brahmins, Varnas, Vaishyas, Shudras","Brahmins, Untouchables, Vaishyas, Shudras","Brahmins, Kshatriyas, Vaishyas, Untouchables","Brahmins, Varnas, Vaishyas, Untouchables"],"e":"Неприкасаемые вне системы четырёх варн.","s":"p","id":20},{"l":"2.1","q":"A varna (caste) in Indian society of governors, rulers, warriors, administrators:","a":"Kshatriya","w":["Vaishya","Shudra","Brahmins","Untouchables"],"e":"Kshatriyas — красный цвет: правители, воины.","s":"p","id":21},{"l":"2.1","q":"Which of the Indian schools provided the study of logic?","a":"Nyaya","w":["Sankhya","Yoga","Vaisesika","Vedanta"],"e":"Nyaya (Akshapada Gotama) — школа логики.","s":"p","id":22},{"l":"2.1","q":"Which of the Indian schools provided the Eightfold Path (the way out of the chains of suffering)?","a":"Buddhism","w":["Sankhya","Yoga","Jainism","Charvaka Lokayata"],"e":"Четыре благородные истины и восьмеричный путь — буддизм.","s":"p","id":23},{"l":"2.1","q":"Which of the following sayings belongs to Buddha?","a":"the cause of suffering is desire","w":["freedom is a recognized necessity","tabula rasa","knowledge is power","Know yourself"],"e":"Вторая благородная истина: причина страдания.","s":"p","id":24},{"l":"2.1","q":"Who, inspired by Sri Aurobindo, initiated the building of the city of Auroville?","a":"Mirra Alfassa","w":["Kapila","Prabhakara","Gautama Siddhartha","Badarayana"],"e":"Mirra Alfassa («The Mother»), 1968.","s":"p","id":25},{"l":"2.2","q":"How many schools existed in Ancient Chinese philosophy (Spring and Autumn period)?","a":"6","w":["8","7","3","5"],"e":"Конфуцианцы, инь-ян, моизм, школа имён, легисты, даосизм.","s":"p","id":26},{"l":"2.2","q":"Who declared that the State is a big family, and family is a small state?","a":"Confucius (Kun Fu Tzu)","w":["Moe Dee","Lao Tzu","Bu Hei Shen","Han Feng-tzu"],"e":"Конфуций: послушание старшим, государство = большая семья.","s":"p","id":27},{"l":"2.2","q":"Who is the author of Tao Te Ching?","a":"Lao Tzu","w":["Kung Fu Tzu","Moe Dee","Han Feng-tzu","Bu Hei Shen"],"e":"Лао-цзы — основа даосизма.","s":"p","id":28},{"l":"2.2","q":"Who was the founder of Moism?","a":"Mo Dee (Moe Dee)","w":["Confucius","Lao Tzu","Shang-di","Chuang Tzu"],"e":"Моизм: всеобщая любовь (jian ai).","s":"p","id":29},{"l":"2.2","q":"How many basic principles does Chinese Legism have (according to the slides)?","a":"12","w":["9","8","15","5"],"e":"ВНИМАНИЕ: на слайдах этого года — 12 принципов легизма. В «сливах» прошлого года ключ был 9. Уточни у преподавателя.","s":"p","id":30},{"l":"2.2","q":"According to this doctrine, army, grain procurement and textile production are the primary values in the state:","a":"Legism","w":["Yin-Yang school","Taoism","Confucianism","Moism"],"e":"Легизм: закон, суровые наказания, армия, зерно, ткани.","s":"p","id":31},{"l":"3","q":"\"What is the beginning of all things?\" is the main question for...","a":"Pre-Socratic period","w":["Socratic period","Orthodox period","Post-Socratic period","Heterodox period"],"e":"1-й период (Ionic, 7–5 вв. до н. э.). Post-Socratic: «What is the existence of human being?»","s":"p","id":32},{"l":"3","q":"A basic problem in Greek philosophy which was put during a certain period:","a":"Arche","w":["Aporia","Apeiron","Humidity","Logos"],"e":"Arche — первоначало.","s":"p","id":33},{"l":"3","q":"The founder of the Milesian school is:","a":"Thales","w":["Anaximenes","Anaximander","Heraclitus","Parmenides"],"e":"Фалес — вода.","s":"p","id":34},{"l":"3","q":"Apeiron is a primary substance in the philosophy of...","a":"Anaximander","w":["Heraclitus","Thales","Anaximenes","Pythagoras"],"e":"Anaximander — apeiron.","s":"p","id":35},{"l":"3","q":"What school did Anaximenes belong to?","a":"Milesian school","w":["School of Heraclitus","Eley school","Pythagorean school","Atomist School"],"e":"Милетская школа: Фалес, Анаксимандр, Анаксимен.","s":"p","id":36},{"l":"3","q":"Who of the Milesian school provided the idea that everything is from air?","a":"Anaximenes","w":["Thales","Anaximander","Heraclitus","Parmenides"],"e":"Anaximenes — воздух.","s":"p","id":37},{"l":"3","q":"Who correlated the element of fire with the world Logos?","a":"Heraclitus","w":["Thales","Plato","Anaximander","Socrates"],"e":"Гераклит: движение, образ — огонь, Логос.","s":"p","id":38},{"l":"3","q":"According to which school movement doesn't exist at all?","a":"Eley school","w":["Atomist school","Pythagorian union","Socrates school","Platonian academy"],"e":"Элейцы (Парменид, Зенон): «всё едино и неизменно».","s":"p","id":39},{"l":"3","q":"The school which Parmenides belonged to:","a":"Eley school","w":["Milesian school","School of Heraclitus","Pythagorean school","Atomist School"],"e":"Парменид и Зенон Элейский.","s":"p","id":40},{"l":"3","q":"Zeno's paradoxes which were addressed to reject motion are...","a":"Aporia","w":["Arche","Apeiron","Logos","Numbers"],"e":"Апории Зенона: Ахиллес и черепаха, стрела.","s":"p","id":41},{"l":"3","q":"What school did Democritus belong to?","a":"Atomist School","w":["Milesian school","School of Sophists","Eley school","School of Heraclitus"],"e":"Атомисты: Левкипп, Демокрит — пустота и атомы.","s":"p","id":42},{"l":"3","q":"Which of the following elevated knowledge to the rank of absolute value?","a":"Socrates","w":["Heraclitus","Plato" const LECS = [
  ["1","Л1 Введение"],["2.1","Л2.1 Индия"],["2.2","Л2.2 Китай"],["3","Л3 Античность"],
  ["4.1","Л4.1 Ср. Европа"],["4.2","Л4.2 Ислам"],["5","Л5 Возрождение"],["6","Л6 Новое время"]
];
const LNAME = Object.fromEntries(LECS);
const SKEY = "phil-quiz-v1";
const $app = document.getElementById("app");
let store = {wrong:[], answered:0, correct:0};
try { const s = JSON.parse(localStorage.getItem(SKEY)||"null"); if (s && Array.isArray(s.wrong)) store = s; } catch(e){}
function save(){ try { localStorage.setItem(SKEY, JSON.stringify(store)); } catch(e){} }
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function prep(q){ const o = shuffle([q.a, ...q.w]); return {...q, opts:o, ci:o.indexOf(q.a), pick:null}; }
const count = l => BANK.filter(q=>q.l===l).length;

let cfg = {lecs:new Set(LECS.map(x=>x[0])), src:"all", n:"20", instant:true};
let S = null, timer = null;

function home(){
  clearInterval(timer);
  const acc = store.answered ? Math.round(100*store.correct/store.answered)+"%" : "—";
  $app.innerHTML = `
  <div class="stack">
    <header>
      <h1>Тест по философии</h1>
      <p class="sub">${BANK.length} вопросов, 5 вариантов ответа, лекции 1–6. </p>
    </header>
    <div class="stats">
      <div class="stat"><b>${store.answered}</b><span>ответов дано</span></div>
      <div class="stat"><b>${acc}</b><span>точность</span></div>
      <div class="stat"><b>${store.wrong.length}</b><span>в ошибках</span></div>
    </div>
    <section class="card stack hl">
      <div><h2>Экзамен</h2>
      <p class="sub">30 вопросов, как на бланке. Около половины из лекций 5 и 6. Ответы видны только в конце.</p></div>
      <div class="row"><button class="btn primary" id="go-exam">Начать экзамен</button></div>
    </section>
    <section class="card stack">
      <h2>Тренировка</h2>
      <div class="chips" id="chips"></div>
      <div class="row">
        <button class="btn" id="p56">Только Л5 + Л6</button>
        <button class="btn" id="pall">Все лекции</button>
      </div>
      <div class="row">
        <label class="field grow">Источник
          <select id="src">
            <option value="all">Все вопросы</option>
            <option value="p">Только прошлых лет</option>
            <option value="s">Только по слайдам</option>
          </select></label>
        <label class="field grow">Сколько вопросов
          <select id="num"><option>10</option><option>20</option><option>30</option><option value="all">Все</option></select></label>
      </div>
      <label class="check"><input type="checkbox" id="inst"> Показывать ответ сразу после выбора</label>
      <div class="row"><button class="btn primary" id="go-prac">Начать тренировку</button><span class="sub" id="pmsg"></span></div>
    </section>
    <section class="card stack">
      <h2>Работа над ошибками</h2>
      <p class="sub">${store.wrong.length ? "Здесь собраны вопросы, на которых ты ошибся. Верный ответ убирает вопрос из списка." : "Пока пусто. Ошибки из тренировок и экзаменов появятся здесь (если браузер сохраняет данные)."}</p>
      <div class="row"><button class="btn primary" id="go-rev" ${store.wrong.length?"":"disabled"}>Повторить ${store.wrong.length} ошибок</button>
      ${store.wrong.length?'<button class="btn" id="clr">Очистить список</button>':''}</div>
    </section>
  </div>`;
  drawChips();
  const $=id=>document.getElementById(id);
  $("src").value=cfg.src; $("num").value=cfg.n; $("inst").checked=cfg.instant;
  $("src").onchange=e=>cfg.src=e.target.value;
  $("num").onchange=e=>cfg.n=e.target.value;
  $("inst").onchange=e=>cfg.instant=e.target.checked;
  $("p56").onclick=()=>{cfg.lecs=new Set(["5","6"]);drawChips();};
  $("pall").onclick=()=>{cfg.lecs=new Set(LECS.map(x=>x[0]));drawChips();};
  $("go-exam").onclick=startExam;
  $("go-prac").onclick=startPractice;
  if($("go-rev")) $("go-rev").onclick=startReview;
  if($("clr")) $("clr").onclick=()=>{store.wrong=[];save();home();};
}
function drawChips(){
  const el=document.getElementById("chips");
  el.innerHTML=LECS.map(([k,n])=>`<button class="chip" data-k="${k}" aria-pressed="${cfg.lecs.has(k)}">${n}<small>${count(k)}</small></button>`).join("");
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; cfg.lecs.has(k)?cfg.lecs.delete(k):cfg.lecs.add(k); drawChips(); });
}
function pick(list,n){ return shuffle(list).slice(0,n); }
function startExam(){
  const quota={"1":3,"2.1":2,"2.2":1,"3":4,"4.1":3,"4.2":3,"5":7,"6":7};
  let qs=[]; for(const [l,n] of Object.entries(quota)) qs=qs.concat(pick(BANK.filter(q=>q.l===l),n));
  begin(shuffle(qs).map(prep),"exam",false);
}
function startPractice(){
  let l=BANK.filter(q=>cfg.lecs.has(q.l) && (cfg.src==="all"||q.s===cfg.src));
  const msg=document.getElementById("pmsg");
  if(!l.length){ msg.textContent="Выбери хотя бы одну лекцию."; return; }
  const n = cfg.n==="all" ? l.length : Math.min(+cfg.n,l.length);
  begin(pick(l,n).map(prep),"practice",cfg.instant);
}
function startReview(){
  const ids=new Set(store.wrong);
  const l=BANK.filter(q=>ids.has(q.id));
  if(!l.length) return;
  begin(shuffle(l).map(prep),"review",true);
}
function begin(qs,mode,instant){
  S={qs,mode,instant,i:0,t0:Date.now(),confirm:false};
  clearInterval(timer);
  timer=setInterval(()=>{const t=document.getElementById("tm"); if(t) t.textContent=fmt(Date.now()-S.t0);},1000);
  quiz();
}
const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");};
const MODE={exam:"Экзамен",practice:"Тренировка",review:"Работа над ошибками"};

function quiz(){
  const q=S.qs[S.i], N=S.qs.length, locked = S.instant && q.pick!==null;
  const answered=S.qs.filter(x=>x.pick!==null).length;
  let opts=q.opts.map((o,k)=>{
    let cls="opt";
    if(locked){ if(k===q.ci) cls+=" ok"; else if(k===q.pick) cls+=" no"; }
    else if(q.pick===k) cls+=" sel";
    return `<li><button class="${cls}" data-k="${k}" ${locked?"disabled":""}><span class="n">${k+1}</span><span>${esc(o)}</span></button></li>`;
  }).join("");
  let fb="";
  if(locked){
    const ok=q.pick===q.ci;
    fb=`<div class="fb ${ok?"ok":"no"}" role="status"><b>${ok?"Верно.":"Неверно."}</b> Правильный ответ: ${q.ci+1}. ${esc(q.a)}${q.e?`<br>${esc(q.e)}`:""}</div>`;
  }
  const last=S.i===N-1;
  const nav = S.mode==="exam" ? `<div class="nav" aria-label="Навигатор по вопросам">${S.qs.map((x,k)=>`<button data-j="${k}" class="${x.pick!==null?"done":""} ${k===S.i?"cur":""}" aria-label="Вопрос ${k+1}">${k+1}</button>`).join("")}</div>` : "";
  const conf = S.confirm ? `<div class="warn stack" style="margin-top:14px"><div>Без ответа: ${N-answered}. Завершить всё равно?</div><div class="row"><button class="btn primary" id="yes">Завершить</button><button class="btn" id="no">Вернуться</button></div></div>` : "";
  $app.innerHTML=`
  <div class="top"><span>${MODE[S.mode]} · ${S.i+1} / ${N}</span><span id="tm">${fmt(Date.now()-S.t0)}</span></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${answered}"><i style="width:${100*answered/N}%"></i></div>
  <section class="card" style="margin-top:14px">
    <div class="row"><span class="tag">${LNAME[q.l]}</span><span class="tag q">${q.s==="p"?"прошлые годы":"слайды"}</span></div>
    <p class="qtext">${esc(q.q)}</p>
    <ul class="opts">${opts}</ul>${fb}
    <div class="foot">
      <button class="btn" id="prev" ${S.i===0||S.instant?"disabled":""}>Назад</button>
      <div class="row">
        <button class="btn" id="quit">В меню</button>
        ${S.instant ? (last ? `<button class="btn primary" id="fin" ${q.pick===null?"disabled":""}>Результат</button>` : `<button class="btn primary" id="next" ${q.pick===null?"disabled":""}>Дальше</button>`)
                    : (last ? `<button class="btn primary" id="fin">Завершить</button>` : `<button class="btn primary" id="next">Дальше</button>`)}
      </div>
    </div>${conf}
  </section>${nav}`;
  const $=id=>document.getElementById(id);
  $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.k));
  if($("prev")) $("prev").onclick=()=>go(-1);
  if($("next")) $("next").onclick=()=>go(1);
  if($("fin")) $("fin").onclick=finishClick;
  if($("quit")) $("quit").onclick=()=>{ if(confirmQuit) {home();} else { confirmQuit=true; $("quit").textContent="Точно выйти?"; setTimeout(()=>{confirmQuit=false;},3000);} };
  if($("yes")) $("yes").onclick=results;
  if($("no")) $("no").onclick=()=>{S.confirm=false;quiz();};
  $app.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{S.i=+b.dataset.j;S.confirm=false;quiz();});
}
let confirmQuit=false;
function choose(k){
  const q=S.qs[S.i];
  if(S.instant && q.pick!==null) return;
  q.pick=k; S.confirm=false; quiz();
}
function go(d){ S.i=Math.max(0,Math.min(S.qs.length-1,S.i+d)); S.confirm=false; quiz(); }
function finishClick(){
  const un=S.qs.filter(x=>x.pick===null).length;
  if(un>0 && !S.instant){ S.confirm=true; quiz(); } else results();
}
function results(){
  clearInterval(timer);
  const N=S.qs.length, ok=S.qs.filter(q=>q.pick===q.ci).length, el=Date.now()-S.t0;
  const w=new Set(store.wrong);
  S.qs.forEach(q=>{ if(q.pick===null) return; store.answered++; if(q.pick===q.ci){store.correct++; w.delete(q.id);} else w.add(q.id); });
  store.wrong=[...w]; save();
  const by={}; S.qs.forEach(q=>{ by[q.l]=by[q.l]||{n:0,ok:0}; by[q.l].n++; if(q.pick===q.ci) by[q.l].ok++; });
  const pct=Math.round(100*ok/N);
  const bars=LECS.filter(([k])=>by[k]).map(([k,n])=>{ const b=by[k], p=Math.round(100*b.ok/b.n); const c=p<60?"low":p<85?"mid":"hi";
    return `<div class="lec"><span>${n}</span><div class="bar"><i class="${c}" style="width:${p}%"></i></div><span>${b.ok}/${b.n}</span></div>`; }).join("");
  const wrong=S.qs.filter(q=>q.pick!==q.ci);
  const rev=wrong.map(q=>`<div class="rev"><div class="row"><span class="tag">${LNAME[q.l]}</span><span class="tag q">${q.s==="p"?"прошлые годы":"слайды"}</span></div>
    <p><b>${esc(q.q)}</b></p>
    <p class="mine">Твой ответ: ${q.pick===null?"нет ответа":esc(q.opts[q.pick])}</p>
    <p class="right">Верно: ${esc(q.a)}</p>${q.e?`<p class="sub">${esc(q.e)}</p>`:""}</div>`).join("");
  $app.innerHTML=`<div class="stack">
    <header><h1>Результат</h1><p class="sub">${MODE[S.mode]} · время ${fmt(el)}</p></header>
    <section class="card stack">
      <div class="row" style="align-items:baseline"><span class="score">${ok}/${N}</span><span class="sub">${pct}%</span></div>
      <div class="stack" style="gap:8px">${bars}</div>
    </section>
    <div class="row">
      ${wrong.length?'<button class="btn primary" id="again">Повторить ошибки этого теста</button>':''}
      <button class="btn ${wrong.length?"":"primary"}" id="menu">В меню</button>
    </div>
    <section class="card"><h2>${wrong.length?"Разбор ошибок ("+wrong.length+")":"Без ошибок"}</h2>${rev}</section>
  </div>`;
  document.getElementById("menu").onclick=home;
  const ag=document.getElementById("again");
  if(ag) ag.onclick=()=>begin(shuffle(wrong).map(q=>prep(BANK[q.id])),"review",true);
}
document.addEventListener("keydown",e=>{
  if(!S||!document.getElementById("tm")) return;
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT") return;
  if(/^[1-5]$/.test(e.key)) choose(+e.key-1);
  else if(e.key==="ArrowRight"||e.key==="Enter"){ const b=document.getElementById("next")||document.getElementById("fin"); if(b && !b.disabled && e.target.tagName!=="BUTTON") b.click(); }
  else if(e.key==="ArrowLeft"){ const b=document.getElementById("prev"); if(b&&!b.disabled) b.click(); }
});
home();
</script>
</body>
</html>
